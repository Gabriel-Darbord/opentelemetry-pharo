name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OTEL_PHARO_OTLP_GRPC_INTEGRATION_OUTPUT_FILE: "/tmp/otel-output/otlp-grpc-traces.json"
      OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE: "/tmp/otel-output/otlp-grpc-traces.json"
      OTEL_PHARO_OTLP_GRPC_INTEGRATION_LOG_OUTPUT_FILE: "/tmp/otel-output/otlp-grpc-logs.json"
      OTEL_PHARO_OTLP_GRPC_INTEGRATION_METRIC_OUTPUT_FILE: "/tmp/otel-output/otlp-grpc-metrics.json"
    strategy:
      matrix:
        include:
          - smalltalk: Pharo64-12
            spec: .smalltalk.ston
            coverage: false
          - smalltalk: Pharo64-13
            spec: .smalltalk.coverage.ston
            coverage: true
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v4
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }} ${{ matrix.spec }}
        shell: bash
        timeout-minutes: 15
      - name: Coveralls
        if: ${{ matrix.coverage }}
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
      - name: Start OpenTelemetry Collector
        if: ${{ matrix.coverage }}
        env:
          OTEL_PHARO_OTLP_GRPC_INTEGRATION_ENABLED: "true"
          OTEL_PHARO_OTLP_GRPC_INTEGRATION_ENDPOINT: "http://127.0.0.1:4317"
        run: |
          mkdir -p "$(dirname "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE")"
          chmod 777 "$(dirname "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE")"
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE" ] && unlink "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE" || true
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_LOG_OUTPUT_FILE" ] && unlink "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_LOG_OUTPUT_FILE" || true
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_METRIC_OUTPUT_FILE" ] && unlink "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_METRIC_OUTPUT_FILE" || true
          docker run -d \
            --name otelcol-integration \
            -p 4317:4317 \
            -v "$GITHUB_WORKSPACE/ci/otel-collector-otlp-grpc.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$(dirname "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE"):/otel-output" \
            ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0 \
            --config /etc/otelcol-contrib/config.yaml
          ready=false
          while [ "$ready" != true ]; do
            if docker logs otelcol-integration 2>&1 | grep -q "Everything is ready. Begin running and processing data." \
              && bash -c 'echo > /dev/tcp/127.0.0.1/4317' 2>/dev/null; then
              ready=true
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx otelcol-integration; then
              docker logs otelcol-integration || true
              exit 1
            fi
            retries="${retries:-0}"
            retries=$((retries + 1))
            if [ "$retries" -ge 30 ]; then
              docker logs otelcol-integration || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs otelcol-integration || true
            exit 1
          fi
        shell: bash
      - name: Run OTLP gRPC Integration Tests
        if: ${{ matrix.coverage }}
        env:
          OTEL_PHARO_OTLP_GRPC_INTEGRATION_ENABLED: "true"
          OTEL_PHARO_OTLP_GRPC_INTEGRATION_ENDPOINT: "http://127.0.0.1:4317"
        run: |
          SMALLTALK_CI_BIN="$(command -v smalltalkci)"
          SMALLTALK_CI_HOME="$(cd "$(dirname "$SMALLTALK_CI_BIN")/.." && pwd)"
          export SMALLTALK_CI_HOME
          source "$SMALLTALK_CI_HOME/env_vars"
          "$SMALLTALK_CI_VM" "$SMALLTALK_CI_IMAGE" --no-default-preferences st ci/run-otlp-grpc-integration-tests.st
        shell: bash
        timeout-minutes: 15
      - name: Dump collector output
        if: ${{ matrix.coverage && always() }}
        run: |
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE" ] && cat "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_TRACE_OUTPUT_FILE" || true
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_LOG_OUTPUT_FILE" ] && cat "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_LOG_OUTPUT_FILE" || true
          [ -f "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_METRIC_OUTPUT_FILE" ] && cat "$OTEL_PHARO_OTLP_GRPC_INTEGRATION_METRIC_OUTPUT_FILE" || true
          docker logs otelcol-integration || true
          docker rm -f otelcol-integration || true
        shell: bash
