receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:

exporters:
  file/traces:
    path: /otel-output/otlp-grpc-traces.json
    format: json
    flush_interval: 100ms
    create_directory: true
  file/logs:
    path: /otel-output/otlp-grpc-logs.json
    format: json
    flush_interval: 100ms
    create_directory: true
  file/metrics:
    path: /otel-output/otlp-grpc-metrics.json
    format: json
    flush_interval: 100ms
    create_directory: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: []
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [file/metrics]
